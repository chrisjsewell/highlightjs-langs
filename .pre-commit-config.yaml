# Run with prek (https://github.com/j178/prek), a fast pre-commit reimplementation.
# Enable the git hooks with `npx prek install`; plain `pre-commit` works too.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^test/(markup|detect)/
      - id: end-of-file-fixer
        exclude: ^test/(markup|detect)/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.5
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.5"]
