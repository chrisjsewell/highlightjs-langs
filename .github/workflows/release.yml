# Release workflow — publishes `highlightjs-langs` to npm when a `vX.Y.Z` tag is pushed.
#
# Two publish modes are auto-detected from whether the `NPM_TOKEN` secret exists:
#
#   * NPM_TOKEN set   -> classic token auth: `npm publish --provenance`.
#   * NPM_TOKEN unset -> OIDC "trusted publishing": plain `npm publish`
#                        (provenance is attached automatically, no secret needed).
#
# FIRST-EVER PUBLISH must use an NPM_TOKEN secret. npm cannot pre-configure
# trusted publishing for a package that does not exist yet, so bootstrap it:
#   1. Create a granular npm automation token for the account.
#   2. Add it as the repository secret `NPM_TOKEN`.
#   3. Push the first `vX.Y.Z` tag — this runs the "Publish (NPM_TOKEN)" path.
#
# AFTER the package exists, switch to trusted publishing:
#   1. On npmjs.com open the package's Settings -> Trusted Publisher -> GitHub Actions
#      and register:  user `chrisjsewell`, repo `highlightjs-langs`, workflow `release.yml`.
#   2. Delete the `NPM_TOKEN` repository secret.
# From then on releases publish via OIDC with zero long-lived credentials.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check tag matches package version
        run: |
          node -e "const v=require('./package.json').version;const t=process.env.GITHUB_REF_NAME;if(t!=='v'+v){console.error('Tag '+t+' does not match package.json version '+v);process.exit(1)}"
      - name: Detect auth mode
        id: auth
        run: |
          echo "token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # --- OIDC trusted publishing (no NPM_TOKEN secret) ---
      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        if: steps.auth.outputs.token == 'false'
        run: npm install -g npm@latest
      - name: Publish (OIDC trusted publishing)
        if: steps.auth.outputs.token == 'false'
        run: npm publish

      # --- Classic token auth (NPM_TOKEN secret set) ---
      - name: Publish (NPM_TOKEN)
        if: steps.auth.outputs.token == 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
