version: 2
updates:
  # Weekly npm updates, grouped into a single pull request.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    # Supply-chain guard: wait out a release's first week before proposing
    # it, so compromised versions are usually yanked before we ever pull
    # them. Dependabot *security* updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 is the native (Go) compiler and drops the JS compiler
      # API that tsup's declaration bundling needs — majors stay ignored
      # until the toolchain supports it (see the tracking issue).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
  # Weekly GitHub Actions updates, grouped into a single pull request.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
