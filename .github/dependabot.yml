version: 2
updates:
  # Weekly npm updates, grouped into a single pull request.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    ignore:
      # TypeScript 7 is the native (Go) compiler and drops the JS compiler
      # API that tsup's declaration bundling needs — majors stay ignored
      # until the toolchain supports it (see the tracking issue).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
  # Weekly GitHub Actions updates, grouped into a single pull request.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      github-actions:
        patterns:
          - "*"
